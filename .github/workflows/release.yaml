name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
    steps:

      - name: Debug - GitHub rate limits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "=== Rate Limits ==="
          curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/rate_limit \
            | jq .

      - name: Debug - Release commit lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "=== Commit API ==="
          curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/qualcomm/mink-idl-compiler/commits/504ccf69e1185880f7bdde06ae34711a10456549 \
            | jq .

      - name: Debug - Files from failing commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "=== Commit Files ==="
          curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/qualcomm/mink-idl-compiler/commits/504ccf69e1185880f7bdde06ae34711a10456549 \
            | jq '.files'

      - name: Debug - GraphQL repository lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "=== GraphQL ==="
          curl -i \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d '{
              "query":"{
                repository(owner:\"qualcomm\",name:\"mink-idl-compiler\") {
                  name
                  defaultBranchRef {
                    name
                  }
                }
              }"
            }'

      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build-and-upload-assets:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-pc-windows-msvc    , os: windows-latest   , idlc_exe: idlc.exe}
          - { target: x86_64-unknown-linux-musl , os: ubuntu-latest    , idlc_exe: idlc    }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm , idlc_exe: idlc    }

    needs: release-please
    if: needs.release-please.outputs.release_created
    permissions:
      contents: write  # needed to upload release assets

    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Install Rust toolchain
      run: rustup target add ${{ matrix.job.target }}

    - name: Show version information (Rust, cargo, GCC)
      shell: bash
      run: |
        ${CC} --version || true
        ${CXX} --version || true
        rustup -V
        rustup toolchain list
        rustup default
        cargo -V
        rustc -V

    - name: Build
      run: cargo build --target ${{ matrix.job.target }} --profile opt

    # --- attach to the GitHub Release created by release-please ---
    - name: Upload assets to GitHub Release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.release-please.outputs.tag_name }}
        NAME: idlc-${{ matrix.job.target }}
      run: |
        cp target/${{ matrix.job.target }}/opt/${{ matrix.job.idlc_exe }} "$NAME"
        gh release upload "$TAG" "$NAME" --clobber
